<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="none">
  <defs>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8d43"/><stop offset=".42" stop-color="#217737"/><stop offset="1" stop-color="#115329"/>
    </linearGradient>
    <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d8ffe5" stop-opacity=".12"/><stop offset=".38" stop-color="#0a301a" stop-opacity="0"/><stop offset="1" stop-color="#04170d" stop-opacity=".35"/></linearGradient>
    <radialGradient id="light" cx="50%" cy="0%" r="85%"><stop stop-color="#effff2" stop-opacity=".24"/><stop offset=".42" stop-color="#9fffc0" stop-opacity=".05"/><stop offset="1" stop-color="#001008" stop-opacity="0"/></radialGradient>
    <pattern id="mow" width="320" height="1000" patternUnits="userSpaceOnUse"><rect width="160" height="1000" fill="#e7ffe8" opacity=".038"/><rect x="160" width="160" height="1000" fill="#001d0c" opacity=".035"/></pattern>
    <pattern id="cross" width="160" height="125" patternUnits="userSpaceOnUse"><path d="M0 0H160V125H0Z" fill="none" stroke="#d7ffe3" stroke-opacity=".022" stroke-width="2"/><path d="M0 125L160 0M-80 125L80 0M80 125L240 0" stroke="#e9fff0" stroke-opacity=".018" stroke-width="2"/></pattern>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".42 .78" numOctaves="3" seed="23"/><feColorMatrix values="0 0 0 0 .12 0 0 0 0 .28 0 0 0 0 .12 0 0 0 .16 0"/><feBlend mode="soft-light" in2="SourceGraphic"/></filter>
