<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">FUTBOL IQ Analiz</title>
<desc id="desc">Futbol topu ve beyin temalı analiz sayfası giriş görseli</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06111d"/>
    <stop offset=".55" stop-color="#0b2033"/>
    <stop offset="1" stop-color="#08131f"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f6dc87"/>
    <stop offset="1" stop-color="#d7aa38"/>
  </linearGradient>
  <radialGradient id="glow" cx=".28" cy=".5" r=".55">
    <stop offset="0" stop-color="#1da8ff" stop-opacity=".28"/>
    <stop offset="1" stop-color="#1da8ff" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".5"/>
  </filter>
</defs>
<rect width="1200" height="400" rx="30" fill="url(#bg)"/>
<rect x="1.5" y="1.5" width="1197" height="397" rx="28.5" fill="none" stroke="#3bb7ff" stroke-opacity=".7" stroke-width="3"/>
<ellipse cx="330" cy="200" rx="300" ry="190" fill="url(#glow)"/>
<image href="futbol-iq-brain-ball.webp" x="30" y="18" width="500" height="364" preserveAspectRatio="xMidYMid slice" clip-path="inset(0 round 24px)"/>
<rect x="500" y="0" width="700" height="400" fill="url(#bg)" opacity=".72"/>
<g transform="translate(560 74)">
  <text x="0" y="56" fill="#f4f7fb" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="900" letter-spacing="1">FUTBOL <tspan fill="#e7bd58">IQ</tspan></text>
  <text x="0" y="110" fill="#52b9ff" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="800" letter-spacing="8">ANALİZ</text>
  <text x="0" y="157" fill="#c6d6e4" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600">Veriye dayalı kararlar. Daha güçlü kadro.</text>
  <g transform="translate(0 205)" filter="url(#shadow)">
    <rect width="420" height="76" rx="20" fill="url(#gold)"/>
    <text x="34" y="48" fill="#0a1720" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="900">ANALİZ SAYFASINA GİT</text>
    <text x="370" y="49" fill="#0a1720" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="900">→</text>
  </g>
  <g transform="translate(454 216)" fill="#8db9d8">
    <rect x="0" y="58" width="16" height="34" rx="3"/>
    <rect x="28" y="36" width="16" height="56" rx="3"/>
    <rect x="56" y="8" width="16" height="84" rx="3"/>
  </g>
</g>
</svg>