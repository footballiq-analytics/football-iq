name: Update TFF Scout Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-tff-scout-data.yml"
      - "scripts/update_tff_scout.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - run: mkdir -p public/data && python scripts/update_tff_scout.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/tff-scout.json
          if git diff --cached --quiet; then
            echo "No data change"
          else
            git commit -m "Refresh TFF scout data"
            git push
          fi
