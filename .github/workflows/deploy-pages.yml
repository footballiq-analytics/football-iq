name: Deploy FUTBOL IQ Fantasy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
                - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build full Super Lig player catalog
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
          python scripts/update_tff_scout.py
          python - <<'PY'
          import json
          d=json.load(open("public/data/tff-scout.json",encoding="utf-8"))
          assert d.get("count",0) >= 350, d.get("count")
          assert d.get("teamCount",0) >= 18, d.get("teamCount")
          print("Validated",d["count"],"players /",d["teamCount"],"teams")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build static site
        run: npm run build
        env:
          GITHUB_ACTIONS: "true"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
# Pages enabled; retry marker
