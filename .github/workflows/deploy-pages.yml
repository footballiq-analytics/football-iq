name: Deploy FUTBOL IQ Fantasy to GitHub Pages

on:
  push:
    branches: [main]
  page_build:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
                - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate static Super Lig catalog
        run: |
          node -e "const d=require('./public/data/tff-scout.json'); if((d.count||0)<350 || (d.teamCount||0)<18) throw new Error('Incomplete catalog: '+d.count+' / '+d.teamCount); console.log('Validated',d.count,'players /',d.teamCount,'teams')"
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build static site
        run: npm run build
        env:
          GITHUB_ACTIONS: "true"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
# Pages enabled; retry marker
